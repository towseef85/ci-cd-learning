
name: DotNet Build and Test CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CICDDemo.Tests/CICDDemo.Tests.csproj

      - name: Build Application and Tests
        run: dotnet build CICDDemo.Tests/CICDDemo.Tests.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test CICDDemo.Tests/CICDDemo.Tests.csproj --no-build --configuration Release

      # NEW: Prepare application for deployment
      - name: Publish Application
        run: dotnet publish CICDDemoProject/CICDDemo.csproj --configuration Release --output ./publish

      # NEW: Store the published application
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-app
          path: ./publish/
          if-no-files-found: error
          retention-days: 7