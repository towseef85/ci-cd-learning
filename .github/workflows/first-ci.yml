
name: DotNet Build and Test CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CICDDemo.Tests/CICDDemo.Tests.csproj

      - name: Build Application and Tests
        run: dotnet build CICDDemo.Tests/CICDDemo.Tests.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test CICDDemo.Tests/CICDDemo.Tests.csproj --no-build --configuration Release
